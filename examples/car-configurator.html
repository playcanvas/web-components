<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>PlayCanvas Web Components - Car Configurator</title>
        <script type="importmap">
            {
                "imports": {
                    "@playcanvas/web-components": "../dist/pwc.mjs",
                    "playcanvas": "../node_modules/playcanvas/build/playcanvas.mjs"
                }
            }
        </script>
        <script type="module" src="../dist/pwc.mjs"></script>
        <link rel="stylesheet" href="css/example.css">
    </head>
    <body>
        <pc-app>
            <!-- Modules -->
            <pc-wasm name="DracoDecoderModule" glue="modules/draco/draco.wasm.js" wasm="modules/draco/draco.wasm.wasm" fallback="modules/draco/draco.js"></pc-wasm>
            <!-- Assets -->
            <pc-asset src="../node_modules/playcanvas/scripts/esm/camera-controls.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-controllers.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-menu.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-navigation.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-session.mjs"></pc-asset>
            <pc-asset src="assets/fonts/arial.json" type="font" id="arial-font"></pc-asset>
            <pc-asset src="assets/scripts/baked-ao.mjs"></pc-asset>
            <pc-asset src="assets/scripts/choose-color.mjs"></pc-asset>
            <pc-asset src="assets/skies/octagon-lamps-photo-studio-2k.hdr" id="studio"></pc-asset>
            <pc-asset src="assets/models/porsche-911-carrera-4s.glb" id="car"></pc-asset>
            <!-- Materials (the ground's diffuse is tuned so its lit value matches the backdrop) -->
            <pc-material id="ground" diffuse="0.84 0.84 0.84" metalness="0" gloss="0.1"></pc-material>
            <!-- Scene -->
            <pc-scene>
                <!-- Sky -->
                <pc-sky asset="studio" type="none" lighting></pc-sky>
                <!-- Camera (with XR support) -->
                <pc-entity name="camera-root">
                    <pc-entity name="camera" position="0 1.75 5">
                        <pc-camera fov="35" tonemap="neutral"></pc-camera>
                        <pc-script>
                            <pc-script-instance name="cameraControls"
                                                enable-fly="false"
                                                enable-pan="false"
                                                focus-point="0 0.5 0"
                                                pitch-range="-90 0"
                                                zoom-range="2.5 15"></pc-script-instance>
                        </pc-script>
                    </pc-entity>
                    <pc-script>
                        <pc-script-instance name="xrControllers"></pc-script-instance>
                        <pc-script-instance name="xrMenu" attributes='{
                            "menuItems": [{"label": "Exit XR", "eventName": "xr:end"}],
                            "fontAsset": "asset:arial-font"
                        }'></pc-script-instance>
                        <pc-script-instance name="xrNavigation"></pc-script-instance>
                        <pc-script-instance name="xrSession"></pc-script-instance>
                    </pc-script>
                </pc-entity>
                <!-- Car -->
                <pc-model name="car" asset="car" position="0 0.625 0" rotation="0 -90 0">
                    <!-- The GLB bakes caption text (and a shadow) into its ground plane - hide
                         it and let the baked AO ground below provide a real one instead -->
                    <pc-node name="Plane" enabled="false"></pc-node>
                    <pc-script>
                        <pc-script-instance name="chooseColor"></pc-script-instance>
                    </pc-script>
                </pc-model>
                <!-- Ground (ambient occlusion baked into it, for a contact shadow) -->
                <pc-entity name="ground" scale="20 1 20">
                    <pc-render type="plane" cast-shadows="false" material="ground"></pc-render>
                    <pc-script>
                        <pc-script-instance name="bakedAo"></pc-script-instance>
                    </pc-script>
                </pc-entity>
                <!-- XR -->
                <pc-entity name="xr">
                    <pc-script>
                        <pc-script-instance name="xrControllers"></pc-script-instance>
                    </pc-script>
                </pc-entity>
            </pc-scene>
        </pc-app>
        <script type="module" src="js/example.mjs"></script>
    </body>
</html>
