<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>PlayCanvas Web Components - Video Texture</title>
        <script type="importmap">
            {
                "imports": {
                    "@playcanvas/web-components": "../dist/pwc.mjs",
                    "playcanvas": "../node_modules/playcanvas/build/playcanvas.mjs"
                }
            }
        </script>
        <script type="module" src="../dist/pwc.mjs"></script>
        <link rel="stylesheet" href="css/example.css">
    </head>
    <body>
        <pc-app>
            <!-- Modules -->
            <pc-wasm name="Basis" glue="modules/basis/basis.wasm.js" wasm="modules/basis/basis.wasm.wasm" fallback="modules/basis/basis.js"></pc-wasm>
            <pc-wasm name="DracoDecoderModule" glue="modules/draco/draco.wasm.js" wasm="modules/draco/draco.wasm.wasm" fallback="modules/draco/draco.js"></pc-wasm>
            <!-- Assets -->
            <pc-asset src="../node_modules/playcanvas/scripts/esm/camera-controls.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-controllers.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-menu.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-navigation.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-session.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/shadow-catcher.mjs"></pc-asset>
            <pc-asset src="assets/fonts/arial.json" type="font" id="arial-font"></pc-asset>
            <pc-asset src="assets/scripts/video-texture.mjs"></pc-asset>
            <pc-asset src="assets/skies/octagon-lamps-photo-studio-2k.hdr" id="studio"></pc-asset>
            <pc-asset src="assets/models/vintage-pc.glb" id="vintage-pc"></pc-asset>
            <!-- Scene -->
            <pc-scene>
                <!-- Sky -->
                <pc-sky asset="studio" type="none" intensity="0.5" lighting></pc-sky>
                <!-- Camera (with XR support) -->
                <pc-entity name="camera-root">
                    <pc-entity name="camera" position="-0.6 0.3 0.85">
                        <pc-camera></pc-camera>
                        <pc-script>
                            <pc-script-instance name="cameraControls"
                                       enable-fly="false"
                                       enable-pan="false"
                                       focus-point="0 0.225 0"
                                       pitch-range="-90 0"
                                       zoom-range="0.5 3"></pc-script-instance>
                        </pc-script>
                    </pc-entity>
                    <pc-script>
                        <pc-script-instance name="xrControllers"></pc-script-instance>
                        <pc-script-instance name="xrMenu" attributes='{
                            "menuItems": [{"label": "Exit XR", "eventName": "xr:end"}],
                            "fontAsset": "asset:arial-font"
                        }'></pc-script-instance>
                        <pc-script-instance name="xrNavigation"></pc-script-instance>
                        <pc-script-instance name="xrSession"></pc-script-instance>
                    </pc-script>
                </pc-entity>
                <!-- Light -->
                <pc-entity name="light" rotation="45 -35 0">
                    <pc-light cast-shadows shadow-distance="5" shadow-intensity="0.4" shadow-resolution="1024" shadow-type="vsm-16f" vsm-blur-size="16"></pc-light>
                </pc-entity>
                <!-- PC -->
                <pc-model name="pc" asset="vintage-pc">
                    <pc-script>
                        <pc-script-instance name="videoTexture" material-name="Screen" url="assets/videos/doom.mp4"></pc-script-instance>
                    </pc-script>
                </pc-model>
                <!-- Shadow Catcher -->
                <pc-entity name="shadow-catcher">
                    <pc-script>
                        <pc-script-instance name="shadowCatcher" scale="2 3 3"></pc-script-instance>
                    </pc-script>
                </pc-entity>
            </pc-scene>
        </pc-app>
        <script type="module" src="js/example.mjs"></script>
    </body>
</html>
