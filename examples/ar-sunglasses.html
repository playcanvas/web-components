<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>PlayCanvas Web Components - AR Sunglasses</title>
        <script type="importmap">
            {
                "imports": {
                    "@mediapipe/tasks-vision": "../node_modules/@mediapipe/tasks-vision/vision_bundle.mjs",
                    "@playcanvas/web-components": "../dist/pwc.mjs",
                    "playcanvas": "../node_modules/playcanvas/build/playcanvas.mjs"
                }
            }
        </script>

        <script type="module" src="../dist/pwc.mjs"></script>
        <link rel="stylesheet" href="css/example.css">
        <style>
            :root {
                --font: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
                --hud-bg: rgba(10, 12, 14, 0.55);
                --hud-border: rgba(255, 255, 255, 0.16);
                --hud-ink: #f2f5f7;
                --accent: #6fd3b2;
            }

            /* Status banner */
            #status {
                position: fixed;
                top: max(18px, env(safe-area-inset-top));
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 18px;
                background: var(--hud-bg);
                border: 1px solid var(--hud-border);
                border-radius: 999px;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                color: var(--hud-ink);
                font-family: var(--font);
                font-size: 14px;
                letter-spacing: 0.02em;
                white-space: nowrap;
                transition: opacity 0.35s ease, transform 0.35s ease;
            }
            #status.hidden {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px);
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent);
                animation: pulse 1.2s ease-in-out infinite;
            }
            #status.error .status-dot {
                background: #ffb02e;
                animation: none;
            }
            @keyframes pulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 1; }
            }

            /* Lens tint swatches */
            #swatches {
                position: fixed;
                bottom: max(26px, env(safe-area-inset-bottom));
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
                display: flex;
                gap: 10px;
                padding: 8px;
                background: var(--hud-bg);
                border: 1px solid var(--hud-border);
                border-radius: 999px;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            #swatches button {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                border: 2px solid rgba(255, 255, 255, 0.25);
                padding: 0;
                cursor: pointer;
                transition: transform 0.15s ease, border-color 0.15s ease;
            }
            #swatches button:hover {
                transform: scale(1.12);
            }
            #swatches button.active {
                border-color: #fff;
            }

            /* Badge shown when running the synthetic ?sim preview */
            #sim-badge {
                position: fixed;
                top: max(18px, env(safe-area-inset-top));
                left: 18px;
                z-index: 10;
                display: none;
                padding: 6px 12px;
                background: var(--hud-bg);
                border: 1px solid var(--hud-border);
                border-radius: 8px;
                color: var(--hud-ink);
                font-family: var(--font);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.14em;
            }
        </style>
    </head>
    <body>
        <pc-app>
            <!-- Assets -->
            <pc-asset src="assets/scripts/camera-feed.mjs"></pc-asset>
            <pc-asset src="assets/scripts/face-tracking.mjs"></pc-asset>
            <pc-asset src="assets/scripts/head-occluder.mjs"></pc-asset>
            <pc-asset src="assets/scripts/lens-tint.mjs"></pc-asset>
            <pc-asset src="assets/models/canonical-face.glb" id="face"></pc-asset>
            <pc-asset src="assets/models/sunglasses.glb" id="sunglasses"></pc-asset>
            <pc-asset src="assets/skies/octagon-lamps-photo-studio-2k.hdr" id="sky"></pc-asset>
            <!-- Scene -->
            <pc-scene>
                <!-- Sky (lighting only) -->
                <pc-sky asset="sky" type="none" lighting></pc-sky>
                <!-- Camera (driven by face tracking). It starts on the same pulled-back
                     orbit that the sim and no-camera fallback modes use -->
                <pc-entity name="camera" position="0 2.5 46">
                    <pc-camera clear-color="0 0 0 0" fov="63" tonemap="aces"></pc-camera>
                    <pc-script>
                        <pc-script-instance name="cameraFeed"></pc-script-instance>
                        <pc-script-instance name="faceTracking"></pc-script-instance>
                    </pc-script>
                </pc-entity>
                <!-- An invisible head that hides the arms of the glasses behind the skull and
                     lets the nose occlude the far rim on head turns: MediaPipe's canonical
                     face mesh (which registers with the tracked face by definition) plus an
                     ellipsoid approximating the cranium. Nudged forward to counter the
                     backward drift the nose bridge anchor shows on strong head turns
                     (fit found live with the ?debug view) -->
                <pc-model name="head-occluder" asset="face" position="0 0 2.5">
                    <pc-script>
                        <pc-script-instance name="headOccluder" center="0 1 -3.5" size="13.5 20 13"></pc-script-instance>
                    </pc-script>
                </pc-model>
                <!-- The sunglasses, worn at the nose bridge of canonical face space and hidden
                     until there is a face to wear them (see the page script). The model is
                     authored resting on a flat surface, so a slight pantoscopic tilt (the
                     bottom of the lenses tucking toward the cheeks) makes it sit naturally -->
                <pc-model name="sunglasses" asset="sunglasses" enabled="false" position="0 -0.7 7.5" rotation="8 0 0" scale="100 100 100">
                    <pc-script>
                        <pc-script-instance name="lensTint"></pc-script-instance>
                    </pc-script>
                </pc-model>
            </pc-scene>
        </pc-app>

        <script>
            // In ?sim mode the synthetic head pose replaces the webcam entirely - remove
            // the camera feed script before the app boots (this classic script runs at
            // parse time, ahead of the deferred module scripts) so no camera permission
            // is ever requested
            const params = new URLSearchParams(window.location.search);
            if (params.has('sim')) {
                document.querySelector('pc-script-instance[name="cameraFeed"]')?.remove();
            }
            // ?debug renders the normally invisible head occluder (the face mesh in green,
            // the cranium ellipsoid in blue) to check its fit against the tracked face
            if (params.has('debug')) {
                document.querySelector('pc-script-instance[name="headOccluder"]')?.setAttribute('debug', 'true');
            }
        </script>

        <!-- HUD -->
        <div id="status"><span class="status-dot"></span><span id="status-text">Loading face tracker…</span></div>
        <div id="swatches">
            <button type="button" class="active" data-color="#1e3a30" style="background: #1e3a30" aria-label="Green lenses"></button>
            <button type="button" data-color="#4a2f1d" style="background: #4a2f1d" aria-label="Brown lenses"></button>
            <button type="button" data-color="#1d3a5f" style="background: #1d3a5f" aria-label="Blue lenses"></button>
            <button type="button" data-color="#8a3b53" style="background: #8a3b53" aria-label="Rose lenses"></button>
            <button type="button" data-color="#2a2a2e" style="background: #2a2a2e" aria-label="Gray lenses"></button>
        </div>
        <div id="sim-badge">SIM</div>

        <script type="module">
            import { whenReady } from '@playcanvas/web-components';

            const { app } = await whenReady('pc-app');

            const sim = new URLSearchParams(window.location.search).has('sim');
            if (sim) document.getElementById('sim-badge').style.display = 'block';

            // Status banner
            const status = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            const setStatus = (text, cls = '') => {
                statusText.textContent = text;
                status.className = cls;
            };

            let cameraError = false;

            app.on('camera:error', () => {
                if (sim) return;
                cameraError = true;
                setStatus('Camera unavailable — previewing without tracking', 'error');
            });

            app.on('face:ready', () => {
                if (!cameraError) setStatus('Show your face');
            });

            // The glasses only exist while there is a face to wear them
            const sunglasses = document.querySelector('pc-model[name="sunglasses"]');

            app.on('face:found', () => {
                sunglasses.enabled = true;
                if (!cameraError) status.classList.add('hidden');
            });

            app.on('face:lost', () => {
                sunglasses.enabled = false;
                if (!cameraError) setStatus('Show your face');
            });

            // Lens tint swatches
            const swatches = document.querySelectorAll('#swatches button');
            swatches.forEach((swatch) => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(other => other.classList.remove('active'));
                    swatch.classList.add('active');
                    app.fire('lens:color', swatch.dataset.color);
                });
            });
        </script>
        <script type="module" src="js/example.mjs"></script>
    </body>
</html>
